<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Assistant</title>
  <defs>
    <!-- Same iris the UI's --accent/--accent-hover tokens use, so the favicon
         and the in-app avatar mark read as one brand rather than two blues. -->
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b5ce2"/>
      <stop offset="1" stop-color="#4b4cc9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Four-point spark: the assistant's presence mark -->
  <path fill="#ffffff" d="M32 12c1.8 9.5 4.5 15.2 8.4 17.6C44.2 32 49.4 32 52 32c-2.6 0-7.8 0-11.6 2.4C36.5 36.8 33.8 42.5 32 52c-1.8-9.5-4.5-15.2-8.4-17.6C19.8 32 14.6 32 12 32c2.6 0 7.8 0 11.6-2.4C27.5 27.2 30.2 21.5 32 12z"/>
  <circle cx="47" cy="16" r="3.5" fill="#ffffff" opacity="0.85"/>
</svg>
