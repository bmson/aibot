steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        infra/docker/backup.Dockerfile,
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backup:latest',
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backup:${_TAG}',
        .,
      ]
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        infra/docker/migrate.Dockerfile,
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/migrate:latest',
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/migrate:${_TAG}',
        .,
      ]
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        infra/docker/agent.Dockerfile,
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:latest',
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:${_TAG}',
        .,
      ]
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        infra/docker/web.Dockerfile,
        --build-arg,
        'GIT_SHA=${_TAG}',
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest',
        -t,
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}',
        .,
      ]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ",${_MODULES}," == *,browser,* || "${_MODULES}" == all ]]; then
          docker build -f infra/docker/browser-job.Dockerfile \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/browser:latest' \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/browser:${_TAG}' .
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/browser:latest'
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/browser:${_TAG}'
        fi
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ",${_MODULES}," == *,code,* || "${_MODULES}" == all ]]; then
          docker build -f infra/docker/code-runner.Dockerfile \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/code:latest' \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/code:${_TAG}' .
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/code:latest'
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/code:${_TAG}'
        fi
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ",${_MODULES}," == *,documents,* || "${_MODULES}" == all ]]; then
          docker build -f infra/docker/document-processor.Dockerfile \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/processor:latest' \
            -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/processor:${_TAG}' .
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/processor:latest'
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/processor:${_TAG}'
        fi
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backup:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backup:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/migrate:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/migrate:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}'
substitutions:
  _REGION: us-west1
  _REPO: assistant
  _TAG: manual
  _MODULES: all
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
