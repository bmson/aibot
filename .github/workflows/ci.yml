name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Three jobs instead of one serial chain: static checks need neither Postgres
# nor a build, so they run alongside the database-backed verification, and the
# build+smoke job reuses caches instead of starting cold. Deploy keys off the
# workflow conclusion, which is the AND of all three.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm.auditConfig.ignoreGhsas in package.json suppresses exactly one
      # advisory: GHSA-mh99-v99m-4gvg (brace-expansion DoS). It reaches us only
      # as workers/document-processor > exceljs > archiver > glob > minimatch,
      # and there is no upstream fix to take — exceljs 4.4.0 is the latest
      # release and pins archiver ^5, which is what holds the old glob chain.
      #
      # Forcing brace-expansion >=5.0.8 is NOT a workaround: minimatch 3 expects
      # its CommonJS function export and throws "expand is not a function" at
      # runtime. That break is invisible to `pnpm test` and `pnpm build`, so the
      # override looks green and ships a broken document-processor.
      #
      # The residual risk is a denial of service through a hostile glob pattern,
      # and nothing routes user input into archiver's glob — it only ever globs
      # paths the worker itself chose. Revisit if exceljs ships a release that
      # moves off archiver 5.
      #
      # The ignore is per-advisory and `pnpm audit` still prints the finding and
      # an ignored count, so a NEW brace-expansion advisory would still fail CI.
      - run: pnpm audit --audit-level moderate
      - name: Scan repository for secrets and insecure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: pnpm lint
      # 900+ lines of deploy bash run against production with no other check.
      - name: Lint shell scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          bash -n infra/gcp/*.sh scripts/*.sh
          shellcheck --severity=warning infra/gcp/*.sh scripts/*.sh
      # The doctor validates the default configuration end to end, including
      # every module's declared readiness and production rules.
      - run: pnpm config:check

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm typecheck
      - run: pnpm test

  build-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo.json declares outputs for both builds; persisting the caches is
      # what makes the declaration worth anything in CI.
      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm seed
      # Smoke the production build that ships, not a dev-server recompile of
      # it. The standalone server pins NODE_ENV=production, so the dev bypass
      # would (correctly) throw; the loopback bypass is the production-shaped
      # path — and it now also exercises the request-level loopback guard.
      - name: Exercise the mobile UI in a real browser
        env:
          AUTH_LOCALHOST_BYPASS: 'true'
          AUTH_URL: http://127.0.0.1:3000
          QUEUE_DRIVER: local
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_BROWSER_CHANNEL: chrome
          SMOKE_CREATE_FIXTURE: 'true'
          PORT: '3000'
          HOSTNAME: 127.0.0.1
        run: |
          # The standalone output carries the server, not the static assets.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
          node apps/web/.next/standalone/apps/web/server.js > "$RUNNER_TEMP/assistant-web.log" 2>&1 &
          assistant_web_pid=$!
          trap 'kill "$assistant_web_pid" 2>/dev/null || true' EXIT
          assistant_web_ready=false
          for assistant_attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              assistant_web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$assistant_web_ready" != true ]; then
            cat "$RUNNER_TEMP/assistant-web.log"
            exit 1
          fi
          pnpm smoke:mobile
