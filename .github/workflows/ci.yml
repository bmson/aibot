name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm.auditConfig.ignoreGhsas in package.json suppresses exactly one
      # advisory: GHSA-mh99-v99m-4gvg (brace-expansion DoS). It reaches us only
      # as workers/document-processor > exceljs > archiver > glob > minimatch,
      # and there is no upstream fix to take — exceljs 4.4.0 is the latest
      # release and pins archiver ^5, which is what holds the old glob chain.
      #
      # Forcing brace-expansion >=5.0.8 is NOT a workaround: minimatch 3 expects
      # its CommonJS function export and throws "expand is not a function" at
      # runtime. That break is invisible to `pnpm test` and `pnpm build`, so the
      # override looks green and ships a broken document-processor.
      #
      # The residual risk is a denial of service through a hostile glob pattern,
      # and nothing routes user input into archiver's glob — it only ever globs
      # paths the worker itself chose. Revisit if exceljs ships a release that
      # moves off archiver 5.
      #
      # pnpm 10 still calls npm's retired legacy audit endpoint, which now
      # returns an undecoded gzip body. Use a pinned current audit client while
      # keeping installs on the repository's package-manager version. The
      # ignore remains per-advisory, so every new moderate advisory still fails.
      - name: Audit dependencies
        run: >-
          corepack pnpm@11.17.0 --pm-on-fail=ignore audit
          --audit-level moderate
          --ignore GHSA-mh99-v99m-4gvg
      - run: pnpm vendor:jelly:check
      - name: Scan repository for secrets and insecure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the WebKit audit browser
        run: pnpm exec playwright install --with-deps webkit
      - name: Exercise the UI in Chromium and WebKit
        env:
          AUTH_DEV_BYPASS: 'true'
          SMOKE_BASE_URL: http://localhost:3000
          SMOKE_BROWSERS: chromium,webkit
          SMOKE_BROWSER_CHANNEL: chrome
          SMOKE_CREATE_FIXTURE: 'true'
        run: |
          pnpm --filter @assistant/web exec next dev --webpack --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/assistant-web.log" 2>&1 &
          assistant_web_pid=$!
          trap 'kill "$assistant_web_pid" 2>/dev/null || true' EXIT
          assistant_web_ready=false
          for assistant_attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              assistant_web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$assistant_web_ready" != true ]; then
            cat "$RUNNER_TEMP/assistant-web.log"
            exit 1
          fi
          if ! pnpm smoke:mobile; then
            tail -n 300 "$RUNNER_TEMP/assistant-web.log"
            exit 1
          fi
