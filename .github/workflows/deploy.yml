name: Deploy production

# The CI workflow runs for each push. This workflow starts only after that
# main-branch run succeeds, so an untested merge never reaches Cloud Run.
#
# workflow_dispatch is the escape hatch for the cases where that chain never
# fires at all: a commit pushed with [skip ci] produces no CI run, so no
# workflow_run event, so no deploy — and CI can also go red for reasons that
# have nothing to do with the commit (a freshly published advisory failing
# `pnpm audit`, a new HIGH CVE failing Trivy). Without a manual path the only
# way to ship a finished web change was an empty commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to release (defaults to the tip of main)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The workflow_run guard must pin the triggering run to a push of this
    # repository's own main branch. `branches: [main]` alone is not that: it
    # filters on the run's head_branch, which for a pull_request-triggered CI
    # run is the PR author's branch name — including a fork branch named
    # "main". Without the head_repository and event checks, a fork PR whose CI
    # passes would start this job, check out the fork's commit, and execute its
    # package scripts and Dockerfiles under the production deploy identity.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      # One resolved commit for the whole job: the CI run's head on the
      # automatic path, the requested (or tip-of-main) commit on the manual one.
      # Everything downstream — checkout, image tags, the /api/health assertion
      # in release.sh — keys off this single value, so the revision that goes
      # live is always the revision that was built and verified.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.sha }}
      # Applies the repo-root .trivyignore to every image scan below: a scoped
      # allow-list of freshly-disclosed CVEs in dormant build tooling (esbuild's
      # embedded Go stdlib, the native tsc) that cannot be patched yet.
      TRIVY_IGNOREFILE: ${{ github.workspace }}/.trivyignore
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      # modules:plan and release.sh both run pnpm scripts against workspace
      # packages, so the deploy runner needs the same toolchain CI uses.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # TEMPORARY: identifiers hardcoded to restore deploys. #14 parameterized
          # these to GitHub Actions Variables (vars.*) that were never populated,
          # so every deploy since has failed here with an empty provider. Revert to
          # ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }} / GCP_DEPLOY_SERVICE_ACCOUNT /
          # GCP_PROJECT once those repo/environment Variables are set.
          workload_identity_provider: projects/83709630368/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: assistant-github-deploy@bmson-assistant.iam.gserviceaccount.com
          project_id: bmson-assistant
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Authorize Artifact Registry
        env:
          GCP_REGION: us-west1
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Resolve optional runtime images
        id: modules
        env:
          ASSISTANT_MODULES: ${{ vars.ASSISTANT_MODULES || 'all' }}
        run: pnpm modules:plan --github-output="$GITHUB_OUTPUT"
      - name: Build immutable images
        env:
          # RUN --mount=type=cache in the Dockerfiles requires BuildKit.
          DOCKER_BUILDKIT: '1'
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          docker build --file infra/docker/backup.Dockerfile --tag "${IMAGE_ROOT}/backup:${IMAGE_TAG}" .
          docker build --file infra/docker/migrate.Dockerfile --tag "${IMAGE_ROOT}/migrate:${IMAGE_TAG}" .
          docker build --file infra/docker/agent.Dockerfile --tag "${IMAGE_ROOT}/agent:${IMAGE_TAG}" .
          docker build --file infra/docker/web.Dockerfile --build-arg "GIT_SHA=${IMAGE_TAG}" --tag "${IMAGE_ROOT}/web:${IMAGE_TAG}" .
          if [ "${{ steps.modules.outputs.browser }}" = "true" ]; then
            docker build --file infra/docker/browser-job.Dockerfile --tag "${IMAGE_ROOT}/browser:${IMAGE_TAG}" .
          fi
          if [ "${{ steps.modules.outputs.code }}" = "true" ]; then
            docker build --file infra/docker/code-runner.Dockerfile --tag "${IMAGE_ROOT}/code:${IMAGE_TAG}" .
          fi
          if [ "${{ steps.modules.outputs.processor }}" = "true" ]; then
            docker build --file infra/docker/document-processor.Dockerfile --tag "${IMAGE_ROOT}/processor:${IMAGE_TAG}" .
          fi
      - name: Scan agent image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/agent:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan migration image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/migrate:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/backup:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/web:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan browser image
        if: steps.modules.outputs.browser == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/browser:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan code image
        if: steps.modules.outputs.code == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/code:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan processor image
        if: steps.modules.outputs.processor == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-west1-docker.pkg.dev/bmson-assistant/assistant/processor:${{ env.RELEASE_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Install SBOM tooling
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOMs and push images
        env:
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
          BUILD_BROWSER: ${{ steps.modules.outputs.browser }}
          BUILD_CODE: ${{ steps.modules.outputs.code }}
          BUILD_PROCESSOR: ${{ steps.modules.outputs.processor }}
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          images="backup migrate agent web"
          [ "$BUILD_BROWSER" = "true" ] && images="$images browser"
          [ "$BUILD_CODE" = "true" ] && images="$images code"
          [ "$BUILD_PROCESSOR" = "true" ] && images="$images processor"
          mkdir -p sbom
          for image in $images; do
            syft "${IMAGE_ROOT}/${image}:${IMAGE_TAG}" -o "spdx-json=sbom/${image}.spdx.json"
            docker push "${IMAGE_ROOT}/${image}:${IMAGE_TAG}"
          done
          printf '%s\n' "$images" > sbom/images.txt
      - name: Upload release SBOMs
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: release-sboms-${{ env.RELEASE_SHA }}
          path: sbom/*.spdx.json
          retention-days: 90
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign images and attach SBOM attestations
        env:
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          for image in $(cat sbom/images.txt); do
            ref="${IMAGE_ROOT}/${image}:${IMAGE_TAG}"
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/${image}.spdx.json" "$ref"
          done
      - name: Release immutable images
        env:
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
          ASSISTANT_MODULES: ${{ steps.modules.outputs.modules }}
          SKIP_IMAGE_BUILD: 'true'
        run: bash infra/gcp/release.sh
