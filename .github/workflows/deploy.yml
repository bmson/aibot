name: Deploy production

# The CI workflow runs for each push. This workflow starts only after that
# main-branch run succeeds, so an untested merge never reaches Cloud Run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/83709630368/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: assistant-github-deploy@bmson-assistant.iam.gserviceaccount.com
          project_id: bmson-assistant
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Authorize Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
      - name: Build and push immutable images
        env:
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_ROOT="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPOSITORY}"
          docker build --file infra/docker/agent.Dockerfile --tag "${IMAGE_ROOT}/agent:${IMAGE_TAG}" .
          docker push "${IMAGE_ROOT}/agent:${IMAGE_TAG}"
          docker build --file infra/docker/web.Dockerfile --tag "${IMAGE_ROOT}/web:${IMAGE_TAG}" .
          docker push "${IMAGE_ROOT}/web:${IMAGE_TAG}"
          docker build --file infra/docker/browser-job.Dockerfile --tag "${IMAGE_ROOT}/browser:${IMAGE_TAG}" .
          docker push "${IMAGE_ROOT}/browser:${IMAGE_TAG}"
      - name: Release immutable images
        env:
          GCP_PROJECT: bmson-assistant
          GCP_REGION: us-west1
          ARTIFACT_REPOSITORY: assistant
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          SKIP_IMAGE_BUILD: 'true'
        run: bash infra/gcp/release.sh
